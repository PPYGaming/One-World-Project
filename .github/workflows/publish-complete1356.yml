name: Publish verified One World beta 1.3.56
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-world-release-writer
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone exact publication revision
        run: |
          git clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" stage
          cd stage
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify signed artifacts and editable source
        run: |
          cd stage
          python3 *restore-complete1356.py
      - name: Commit editable source without credentials
        run: |
          cd stage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web android scripts docs README.md CONTRIBUTING.md CHANGELOG.md SOURCE-INVENTORY.json .gitignore
          git commit -m "Import audited One World 1.3.56 source"
      - name: Publish numbered testing beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd stage
          gh auth setup-git
          git push origin HEAD:main
          gh release create v1.3.56 release/one-world-beta-1.3.56.apk release/beta-update.json release/one-world-project-source-1.3.56.zip --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title "One World Beta 1.3.56 - Physical item models, placement preview and crafting XP" --notes-file release/release-notes.md
